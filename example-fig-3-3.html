<script>

const PHI0 = 2.61799388;
const L = {"a":45,"b":120,"c":90,"d":100}, SIDE = 1;
const S = 2.9, OX = 175, OY = 500, D2R = 0.017453292519943295, DEG = 57.29577951308232;
function solve4(L, phiDeg, side = 1) {
  const { a, b, c, d } = L;
  const A = [0, 0], D = [d, 0];
  const p = phiDeg * D2R;
  const B = [a * Math.cos(p), a * Math.sin(p)];
  const dx = D[0] - B[0], dy = D[1] - B[1], dist = Math.hypot(dx, dy);
  if (dist > b + c || dist < Math.abs(b - c)) return null;      // 该 φ 无解
  const q = (b * b - c * c + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0, b * b - q * q)) * side;
  const ux = dx / dist, uy = dy / dist;
  const C = [B[0] + q * ux - h * uy, B[1] + q * uy + h * ux];
  return {
    A, B, C, D,
    phi: phiDeg,
    psi: Math.atan2(C[1] - D[1], C[0] - D[0]) * DEG,           // 摇杆角（从 +x 起，逆时针为正）
    coupler: Math.atan2(C[1] - B[1], C[0] - B[0]) * DEG        // 连杆方向
  };
}
const sx = (u) => OX + u * S, sy = (w) => OY - w * S;
const $ = (id) => document.getElementById(id);
const el = { crankU:$("crankU"), crank:$("crank"), linkU:$("linkU"), link:$("link"), rockerU:$("rockerU"), rocker:$("rocker"),
             pinB:$("pinB"), pinC:$("pinC"), tagB:$("tagB"), tagC:$("tagC"),
             n1:$("n1"), n2:$("n2"), n3:$("n3"), n4:$("n4"),
             phi:$("phiV"), psi:$("psiV"), mark:$("psiMark") };
const PSI0 = 59.540, PSI1 = 133.872;
const BX0 = 640, BX1 = 880, BY = 352;

function seg(a, b){ const l = sy(a[1]) - sy(b[1]) === 0 ? "h" : ""; return [sx(a[0]),sy(a[1]),sx(b[0]),sy(b[1])]; }
function setLine(id, a, b){
  const [x1,y1,x2,y2] = [sx(a[0]), sy(a[1]), sx(b[0]), sy(b[1])];
  for (const k of [id, id + "U"]) { const e = el[k]; e.setAttribute("x1",x1.toFixed(2)); e.setAttribute("y1",y1.toFixed(2)); e.setAttribute("x2",x2.toFixed(2)); e.setAttribute("y2",y2.toFixed(2)); }
}
function movePin(id, p){ el[id].setAttribute("transform", "translate(" + sx(p[0]).toFixed(2) + " " + sy(p[1]).toFixed(2) + ")"); }
function moveTag(id, p, dx, dy){ el[id].setAttribute("transform", "translate(" + (sx(p[0])+dx).toFixed(2) + " " + (sy(p[1])+dy).toFixed(2) + ")"); }
function mid(a, b, off){                        // 杆中点 + 屏幕法向偏移
  const x1 = sx(a[0]), y1 = sy(a[1]), x2 = sx(b[0]), y2 = sy(b[1]);
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  return [ (x1+x2)/2 - dy/len*off, (y1+y2)/2 + dx/len*off ];
}
function putNum(id, p){ el[id].setAttribute("x", p[0].toFixed(2)); el[id].setAttribute("y", p[1].toFixed(2)); }

function draw(){
  const s = solve4(L, phi * DEG, SIDE);
  if (!s) return;
  setLine("crank", s.A, s.B);
  setLine("link",  s.B, s.C);
  setLine("rocker",s.C, s.D);
  movePin("pinB", s.B); movePin("pinC", s.C);
  moveTag("tagB", s.B, -24, -16); moveTag("tagC", s.C, 24, -16);
  putNum("n1", mid(s.A, s.B,  16));
  putNum("n2", mid(s.B, s.C, -16));
  putNum("n3", mid(s.C, s.D,  16));
  putNum("n4", mid(s.A, s.D,  22));
  const phiD = ((phi * DEG) % 360 + 360) % 360;
  el.phi.textContent = phiD.toFixed(1);
  el.psi.textContent = s.psi.toFixed(1);
  const t = (s.psi - PSI0) / (PSI1 - PSI0 || 1);
  el.mark.setAttribute("x1", (BX0 + Math.max(0, Math.min(1, t)) * (BX1 - BX0)).toFixed(2));
  el.mark.setAttribute("x2", el.mark.getAttribute("x1"));
}

const calm = matchMedia("(prefers-reduced-motion: reduce)");
const stage = document.querySelector("[data-stage]");
const MIN = 0, MAX = 6.283185307179586, BOUNCE = false, STEP = 5 * Math.PI / 180;
const clamp = (v) => Math.min(MAX, Math.max(MIN, v));
let phi = clamp(PHI0), target = phi, touring = false, dir = 1, idleAt = performance.now(), frame = 0, last = 0, drag = null;
function kick(){ idleAt = performance.now(); if(!frame){ last = 0; frame = requestAnimationFrame(tick); } }
function tick(now){
  frame = 0;
  const dt = Math.min((now - last) / 1000, 1/30) || 0.016;
  last = now;
  if (touring && !drag){
    target += dir * 0.6 * dt;
    if (target >= MAX){ target = MAX; dir = BOUNCE ? -1 : 0; if (!BOUNCE) touring = false; }
    else if (target <= MIN){ target = MIN; dir = BOUNCE ? 1 : 0; if (!BOUNCE) touring = false; }
  }
  if (!calm.matches){
    const d = target - phi;
    phi += Math.abs(d) < 1e-4 ? d : d * (1 - Math.exp(-dt / 0.15));
    if (Math.abs(d) < 1e-4) phi = target;
  } else phi = target;
  draw();
  if ((touring || Math.abs(target - phi) > 1e-4)) frame = requestAnimationFrame(tick);
}
stage.addEventListener("pointerdown", (e) => {
  stage.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, phi: target }; touring = false; dir = 1;
  stage.focus({ preventScroll: true }); kick();
});
stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  target = clamp(drag.phi + (e.clientX - drag.x) * 0.012);
  phi = target; kick();
});
const endDrag = () => { if (!drag) return; drag = null; kick(); };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight"){ target = clamp(target + STEP); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === "ArrowLeft"){ target = clamp(target - STEP); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === "Home"){ target = clamp(2.6179938779914944); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === "End"){ target = clamp(6.283185307179586); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === " "){ touring = !touring; dir = 1; kick(); e.preventDefault(); }
});
setInterval(() => {
  if (calm.matches) return;
  if (!drag && !touring && performance.now() - idleAt > 3800) { touring = true; dir = 1; kick(); }
}, 600);
draw();
if (!calm.matches) frame = requestAnimationFrame(tick);


</script>
