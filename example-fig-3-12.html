  <text x="717" y="708" font-family=""JetBrains Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace" font-size="11" fill="#41546B" letter-spacing="0.1em">M-03-12</text>
  <text x="891" y="651" font-family=""Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif" font-size="9.5" fill="#6E819A" letter-spacing="0.1em">比例</text>
  <text x="891" y="667" font-family=""JetBrains Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace" font-size="12" fill="#16202E" letter-spacing="0.08em">1 : 1</text>
</g>
<text x="56" y="712" font-family=""Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif" font-size="11.5" fill="#6E819A" letter-spacing="0.12em">拖动翻转砂箱</text>
<text x="144" y="712" font-family=""JetBrains Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace" font-size="11.5" fill="#A9B7C7" letter-spacing="0.1em">·</text>
<text x="156" y="712" font-family=""JetBrains Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace" font-size="11.5" fill="#6E819A" letter-spacing="0.12em">← → 步进 · 空格暂停</text><style>#box,#boxIn,#boxTag{transition:none}</style>
    </svg>
  </div>
  <div class="cap">造型机的翻箱机构：双摇杆机构 ABCD，杆长按教材原图比例量取 AB 210、BC 66、CD 290、AD 118（s+l = 356 > p+q = 328，不满足格拉肖夫条件）。砂箱固定在连杆 BC 上：先在 BC 位置造型振实，再由摇杆 AB 摆过 60° 带动连杆把砂箱送到 B′C′ 位置以便拔模。图中点划线是铰点 B、C 的轨迹，虚线是砂箱的终点位置。<b>按四杆位形实测</b>，这段运动里连杆转过约 149°（不是严格的 180°）——教材所说的「翻转 180°」是指砂箱被整个翻过来、顶面朝下以便拔模，绘图时按 180° 示意。</div>
</div>
<script>

const $ = (id) => document.getElementById(id);
const L = {"a":210,"b":66,"c":290,"d":118};
const P0 = 141 * Math.PI / 180, P1 = 81 * Math.PI / 180;
const PHI0 = P0;
const S = 1.25, OX = 306, OY = 515;
const sx = (u) => OX + u * S, sy = (w) => OY - w * S;
const FLASK = {"len":58,"wid":34,"fin":12,"finW":20,"gap":5};

function solve4(L, phiDeg, side) {
  const { a, b, c, d } = L, R = Math.PI / 180;
  const p = phiDeg * R;
  const B = [a * Math.cos(p), a * Math.sin(p)], D = [d, 0];
  const dx = D[0] - B[0], dy = D[1] - B[1], dist = Math.hypot(dx, dy);
  if (dist > b + c || dist < Math.abs(b - c)) return null;
  const q = (b * b - c * c + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0, b * b - q * q)) * side;
  const ux = dx / dist, uy = dy / dist;
  const C = [B[0] + q * ux - h * uy, B[1] + q * uy + h * ux];
  return { A: [0, 0], B, C, D, coupler: Math.atan2(C[1] - B[1], C[0] - B[0]) * 180 / Math.PI };
}
function boxOf(s) {
  const ux = (s.C[0] - s.B[0]) / L.b, uy = (s.C[1] - s.B[1]) / L.b;
  const nx = -uy, ny = ux;
  const o = [s.C[0] + ux * FLASK.gap, s.C[1] + uy * FLASK.gap];
  const P = (e, m) => [o[0] + ux * e + nx * m, o[1] + uy * e + ny * m];
  const hl = FLASK.len, hw = FLASK.wid / 2, fw = FLASK.finW / 2;
  return [P(0,-hw), P(hl,-hw), P(hl,-fw), P(hl+FLASK.fin,-fw), P(hl+FLASK.fin,fw), P(hl,fw), P(hl,hw), P(0,hw)];
}
const poly = (pts) => pts.map((p,i)=> (i?"L":"M") + sx(p[0]).toFixed(2) + " " + sy(p[1]).toFixed(2)).join("") + "Z";
const un = (x) => { while (x > 180) x -= 360; while (x <= -180) x += 360; return x; };

const el = {
  crank:$("crank"), link:$("link"), rock:$("rocker"),
  box:$("box"), boxIn:$("boxIn"), boxTag:$("boxTag"),
  pinB:$("pinB"), pinC:$("pinC"), tagB:$("tagB"), tagC:$("tagC"),
  tagB2:$("tagB2"), tagC2:$("tagC2"),
  theta:$("thetaV"), alpha:$("alphaV"), prog:$("prog"), progV:$("progV"),
  n1:$("n1"), n2:$("n2"), n3:$("n3")
};
const setLine = (id, p, q) => {
  const L1 = el[id], U = el[id + "U"];
  L1.setAttribute("x1", sx(p[0]).toFixed(2)); L1.setAttribute("y1", sy(p[1]).toFixed(2));
  L1.setAttribute("x2", sx(q[0]).toFixed(2)); L1.setAttribute("y2", sy(q[1]).toFixed(2));
  if (U) { U.setAttribute("x1", L1.getAttribute("x1")); U.setAttribute("y1", L1.getAttribute("y1"));
           U.setAttribute("x2", L1.getAttribute("x2")); U.setAttribute("y2", L1.getAttribute("y2")); }
};
const movePin = (id, p) => el[id].setAttribute("transform", "translate(" + sx(p[0]).toFixed(2) + " " + sy(p[1]).toFixed(2) + ")");
const moveTag = (id, p, dx, dy) => el[id].setAttribute("transform",
  "translate(" + (sx(p[0]) + dx).toFixed(2) + " " + (sy(p[1]) + dy).toFixed(2) + ")");

let start = null;
function draw() {
  const ph = phi * 180 / Math.PI;
  const s = solve4(L, ph, -1);
  if (!s) return "";
  if (!start) start = s.coupler;
  setLine("crank", s.A, s.B); setLine("link", s.B, s.C); setLine("rock", s.C, s.D);
  movePin("pinB", s.B); movePin("pinC", s.C);
  moveTag("tagB", s.B, -20, -10); moveTag("tagC", s.C, -44, 6);
  el.box.setAttribute("d", poly(boxOf(s)));
  const bx = boxOf(s);
  const cx = bx.reduce((a, p) => a + p[0], 0) / bx.length, cy = bx.reduce((a, p) => a + p[1], 0) / bx.length;
  el.boxIn.setAttribute("d", poly(bx.map(p => [p[0] + (cx - p[0]) * 0.16, p[1] + (cy - p[1]) * 0.16])));
  el.boxTag.setAttribute("x", sx(cx).toFixed(2)); el.boxTag.setAttribute("y", sy(cy).toFixed(2));
  const tilt = Math.abs(un(s.coupler - start));
  el.theta.textContent = tilt.toFixed(0);
  el.alpha.textContent = ph.toFixed(0);
  const prog = (P0 - phi) / (P0 - P1);
  el.progV.textContent = Math.round(prog * 100);
  el.prog.setAttribute("x2", (690 + 254 * prog).toFixed(1));
  el.n1.setAttribute("x", sx((s.A[0] + s.B[0]) / 2).toFixed(1)); el.n1.setAttribute("y", sy((s.A[1] + s.B[1]) / 2).toFixed(1));
  el.n2.setAttribute("x", sx((s.B[0] + s.C[0]) / 2 - 12).toFixed(1)); el.n2.setAttribute("y", sy((s.B[1] + s.C[1]) / 2).toFixed(1));
  el.n3.setAttribute("x", sx((s.C[0] + s.D[0]) / 2).toFixed(1)); el.n3.setAttribute("y", sy((s.C[1] + s.D[1]) / 2).toFixed(1));
  return "连杆 " + tilt.toFixed(0) + "° · 摇杆 " + ph.toFixed(0) + "°";
}

const calm = matchMedia("(prefers-reduced-motion: reduce)");
const stage = document.querySelector("[data-stage]");
const MIN = 1.413716694115407, MAX = 2.4609142453120048, BOUNCE = true, STEP = 0.029088820866572156;
const clamp = (v) => Math.min(MAX, Math.max(MIN, v));
let phi = clamp(PHI0), target = phi, touring = false, dir = 1, idleAt = performance.now(), frame = 0, last = 0, drag = null;
function kick(){ idleAt = performance.now(); if(!frame){ last = 0; frame = requestAnimationFrame(tick); } }
function tick(now){
  frame = 0;
  const dt = Math.min((now - last) / 1000, 1/30) || 0.016;
  last = now;
  if (touring && !drag){
    target += dir * 0.35 * dt;
    if (target >= MAX){ target = MAX; dir = BOUNCE ? -1 : 0; if (!BOUNCE) touring = false; }
    else if (target <= MIN){ target = MIN; dir = BOUNCE ? 1 : 0; if (!BOUNCE) touring = false; }
  }
  if (!calm.matches){
    const d = target - phi;
    phi += Math.abs(d) < 1e-4 ? d : d * (1 - Math.exp(-dt / 0.15));
    if (Math.abs(d) < 1e-4) phi = target;
  } else phi = target;
  draw();
  if ((touring || Math.abs(target - phi) > 1e-4)) frame = requestAnimationFrame(tick);
}
stage.addEventListener("pointerdown", (e) => {
  stage.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, phi: target }; touring = false; dir = 1;
  stage.focus({ preventScroll: true }); kick();
});
stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  target = clamp(drag.phi + (e.clientX - drag.x) * 0.006);
  phi = target; kick();
});
const endDrag = () => { if (!drag) return; drag = null; kick(); };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight"){ target = clamp(target + STEP); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === "ArrowLeft"){ target = clamp(target - STEP); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === "Home"){ target = clamp(2.4609142453120048); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === "End"){ target = clamp(1.413716694115407); touring = false; dir = 1; kick(); e.preventDefault(); }
  else if (e.key === " "){ touring = !touring; dir = 1; kick(); e.preventDefault(); }
});
setInterval(() => {
  if (calm.matches) return;
  if (!drag && !touring && performance.now() - idleAt > 3800) { touring = true; dir = 1; kick(); }
}, 600);
draw();
if (!calm.matches) frame = requestAnimationFrame(tick);

</script>
</body>
</html>
